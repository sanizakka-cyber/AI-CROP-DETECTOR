name: Security Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'msas-system/**'
      - '.github/workflows/security-regression-tests.yml'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msas-system

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, fileinfo, gd, zip, intl, bcmath, exif, pcntl
          coverage: none

      - name: Generate app key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Ensure bootstrap/cache exists
        run: mkdir -p bootstrap/cache

      - name: Composer install
        id: composer_install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts 2>&1 | tee /tmp/composer-install.log

      - name: Composer audit
        id: composer_audit
        # composer audit is a dependency-risk report, not a merge gate —
        # intentionally allowed to fail without failing the job (reviewed
        # manually). The test steps below are the real gate and must NOT
        # share this leniency.
        run: composer audit --locked 2>&1 | tee /tmp/composer-audit.log || true

      - name: Run SecurityRegressionTest
        id: sec_test
        # `cmd | tee file` on its own reports tee's exit code (always 0),
        # not php artisan test's — a failing test suite would never fail
        # this step or the job. Audit finding 2026-10-09: this masked every
        # test failure since this workflow was introduced; `conclusion`
        # read "success" on a run with 18 failing tests. PIPESTATUS[0] is
        # bash-specific, so the shell is pinned explicitly rather than
        # relying on the runner's default.
        shell: bash
        run: |
          php artisan test --filter=SecurityRegressionTest --display-warnings --display-deprecations 2>&1 | tee /tmp/sec-test.log
          exit ${PIPESTATUS[0]}

      - name: Run full test suite
        id: full_test
        shell: bash
        run: |
          php artisan test --display-warnings --display-deprecations 2>&1 | tee /tmp/full-test.log
          exit ${PIPESTATUS[0]}

      - name: Publish results as a GitHub Issue (always runs)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function tail(path, n) {
              if (!fs.existsSync(path)) return '(no output captured)';
              const lines = fs.readFileSync(path, 'utf8').split('\n');
              return lines.slice(-n).join('\n');
            }
            const body = [
              '## Security Regression Test run — ' + new Date().toISOString(),
              '',
              '**Commit:** ' + context.sha,
              '**Overall run conclusion source:** step outcomes below',
              '',
              '### Composer install (last 60 lines)',
              '```', tail('/tmp/composer-install.log', 60), '```',
              '',
              '### Composer audit (last 40 lines)',
              '```', tail('/tmp/composer-audit.log', 40), '```',
              '',
              '### SecurityRegressionTest filter (last 500 lines)',
              '```', tail('/tmp/sec-test.log', 500), '```',
              '',
              '### Full test suite (last 500 lines)',
              '```', tail('/tmp/full-test.log', 500), '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI Security Test Results — ' + context.sha.substring(0,7) + ' — run ' + context.runId,
              body: body,
              labels: ['ci-test-results']
            });
