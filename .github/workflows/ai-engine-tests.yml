name: AI Engine Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-engine/**'
      - '.github/workflows/ai-engine-tests.yml'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt 2>&1 | tee /tmp/pip-install.log

      - name: Run tests
        id: tests
        shell: bash
        # No API key is set here on purpose -- these are pure unit tests
        # against _normalize_image_bytes() and never call the Anthropic
        # API. Piping through tee alone would mask pytest's exit code (the
        # same bug found and fixed in the Laravel workflow this phase) --
        # PIPESTATUS[0] is the actual guard here.
        run: |
          pytest tests/ -v 2>&1 | tee /tmp/pytest.log
          exit ${PIPESTATUS[0]}

      - name: Publish results as a GitHub Issue (always runs)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function tail(path, n) {
              if (!fs.existsSync(path)) return '(no output captured)';
              const lines = fs.readFileSync(path, 'utf8').split('\n');
              return lines.slice(-n).join('\n');
            }
            function capChars(s, max) {
              return s.length > max ? '…(truncated, showing last ' + max + ' chars)…\n' + s.slice(-max) : s;
            }
            const sections = [
              ['Pip install (last 40 lines)', capChars(tail('/tmp/pip-install.log', 40), 6000)],
              ['pytest (last 200 lines)', capChars(tail('/tmp/pytest.log', 200), 30000)],
            ];
            let body = [
              '## AI Engine Test run — ' + new Date().toISOString(),
              '',
              '**Commit:** ' + context.sha,
              '',
              ...sections.flatMap(([title, content]) => ['### ' + title, '```', content, '```', '']),
            ].join('\n');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n…(body truncated to stay under GitHub\'s issue size limit)…';
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'AI Engine Test Results — ' + context.sha.substring(0,7) + ' — run ' + context.runId,
                body: body,
                labels: ['ci-test-results']
              });
            } catch (err) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'AI Engine Test Results (minimal — publish failed) — ' + context.sha.substring(0,7) + ' — run ' + context.runId,
                body: 'Full results could not be published: ' + String(err).slice(0, 2000)
                  + '\n\nSee run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                labels: ['ci-test-results']
              });
            }
