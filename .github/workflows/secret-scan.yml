name: Secret Scan

# Phase 12.2: fails any push or pull request that adds a secret. Scans the
# whole history with the repo rules (.gitleaks.toml); secrets that were
# already in history before 2026-10-18 are listed by fingerprint in
# .gitleaksignore (and treated as compromised), so only new leaks fail.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tar.gz" | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gl.tar.gz

      - name: Scan history
        # --redact: findings name the file, line and rule, never the value.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
