# ── MSAS FarmAI — STAGING (Phase 12.2) ───────────────────────────────────────
# A separate Blueprint file on purpose: if production is synced from
# render.yaml, adding staging there would create (billable) services the
# moment it merged. This file is applied only when you create a Blueprint
# with "Blueprint file path" = render.staging.yaml (docs/staging.md).
#
# Deploys the `staging` git branch: push what you want to test there, e.g.
#   git push origin phase12-scan-parity:staging
#
# Differences from production:
#  - own database, own secrets, APP_ENV=staging (QA accounts, test-only payments)
#  - mail goes to the log, never to real people
#  - only QA accounts can scan (QA_SCANS_QA_ONLY); QA quota 200/month
#  - speech features off
#  - QA passwords, the engine key and the app key seed are generated by
#    Render (generateValue) and never appear in this repo or in any log

services:

  - type: web
    name: msas-farmai-staging
    env: docker
    dockerfilePath: ./msas-system/Dockerfile
    dockerContext: ./msas-system
    region: frankfurt
    plan: free                 # sleeps when idle; first request after a sleep takes ~1 min
    branch: staging
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "MSAS FarmAI (staging)"
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://msas-farmai-staging.onrender.com
      # docker/start.sh derives APP_KEY from this when APP_KEY is unset.
      - key: APP_KEY_SEED
        generateValue: true
      - key: APP_LOCALE
        value: en

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: msas-db-staging, property: host }
      - key: DB_PORT
        fromDatabase: { name: msas-db-staging, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: msas-db-staging, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: msas-db-staging, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: msas-db-staging, property: password }

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: SANCTUM_STATEFUL_DOMAINS
        value: msas-farmai-staging.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://msas-farmai-staging.onrender.com

      - key: AI_ENGINE_URL
        value: https://msas-ai-engine-staging.onrender.com
      - key: AI_ENGINE_KEY
        fromService: { type: web, name: msas-ai-engine-staging, envVarKey: API_KEY }

      # Never email real people from staging.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: staging@msasagro.com

      # Payments: Paystack TEST keys only (sk_test_ / pk_test_). Live keys
      # are refused outside production (AppServiceProvider).
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PAYMENT_URL
        value: https://api.paystack.co

      # QA accounts (config/qa.php; forced off in production whatever these say).
      - key: QA_ACCOUNTS_ENABLED
        value: "true"
      - key: QA_SCAN_LIMIT
        value: "200"
      - key: QA_SCANS_QA_ONLY
        value: "true"
      - key: QA_FARMER_PASSWORD
        generateValue: true
      - key: QA_DEALER_PASSWORD
        generateValue: true
      - key: QA_EXTENSION_PASSWORD
        generateValue: true
      - key: QA_ADMIN_PASSWORD
        generateValue: true

      # Speech ("Listen to your result", PR #157). The CPU speech service
      # (English Kokoro + Hausa OpenBible) is its own Blueprint,
      # render.staging-speech.yaml, because it needs a paid instance (4 GB).
      # Until it exists, translated text works and audio says it is unavailable.
      - key: SPEECH_PREGENERATE
        value: "true"
      - key: TTS_CPU_URL
        value: https://msas-tts-cpu-staging.onrender.com
      # Copy the speech service's TTS_SERVICE_KEY here (Render -> msas-tts-cpu-staging -> Environment).
      - key: TTS_CPU_KEY
        sync: false
      - key: SPEECH_YARNGPT_ENABLED
        value: "false"
      - key: SPEECH_FARMERLINE_CONFIRMED
        value: "false"

      - key: DIAGNOSIS_MIN_CONFIDENCE
        value: "65"
      - key: DIAGNOSIS_CONFIRM_BELOW
        value: "75"
      - key: FILESYSTEM_DISK
        value: local

  - type: web
    name: msas-ai-engine-staging
    env: python
    region: frankfurt
    plan: free
    branch: staging
    autoDeploy: true
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Use a SEPARATE Anthropic key for staging, so QA spend is visible and
      # can be capped on its own (console.anthropic.com > API keys > limits).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: SCAN_PASSES
        value: "3"

databases:
  - name: msas-db-staging
    databaseName: msas_staging
    user: msas_staging
    # Render allows one free database per workspace and free databases
    # expire after 30 days. If production already uses the free one, this
    # needs a paid plan: that is a spending decision (docs/staging.md).
    plan: free
    region: frankfurt
