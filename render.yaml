# ── MSAS FarmAI — Render Infrastructure ──────────────────────────────────────
# Deploy via: https://dashboard.render.com/new/blueprint
# Repo:        https://github.com/sanizakka-cyber/AI-CROP-DETECTOR

services:

  # ── Laravel API + Web Dashboard ────────────────────────────────────────────
  - type: web
    name: msas-farmai
    env: docker
    dockerfilePath: ./msas-system/Dockerfile
    dockerContext: ./msas-system
    region: frankfurt          # Closest to Nigeria
    plan: starter              # $7/mo — keeps app always-on (free tier sleeps)
    healthCheckPath: /api/health

    envVars:
      - key: APP_NAME
        value: "MSAS FarmAI"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://www.msasagro.com
      # SECURITY: rotate this in the Render dashboard — it was previously
      # committed in plaintext to a public repo. Generate a fresh one with
      # `php artisan key:generate --show` and set it manually (sync: false
      # means Render will NOT overwrite whatever value is set in the dashboard).
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: en

      # Database — auto-wired from the PostgreSQL service below
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: msas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: msas-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: msas-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: msas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: msas-db
          property: password

      # Session / Cache (no Redis needed initially)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "false"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Logging → Render log viewer.
      # LOG_LEVEL=warning (not error): several security-relevant signals are
      # logged at warning level (failed webhook signatures, payment amount/
      # ownership mismatches, OTP lockouts) — at LOG_LEVEL=error they were
      # silently discarded and never reached the log viewer at all.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # Domain & CORS
      - key: SANCTUM_STATEFUL_DOMAINS
        value: msasagro.com,www.msasagro.com
      - key: SESSION_DOMAIN
        value: .msasagro.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://msasagro.com,https://www.msasagro.com

      # AI Engine — points to the msas-ai-engine service below
      - key: AI_ENGINE_URL
        value: https://msas-ai-engine.onrender.com
      # SECURITY: rotate this — it was previously committed in plaintext to a
      # public repo. Generate a fresh random value and set the SAME value
      # here and as API_KEY on the msas-ai-engine service below (both in the
      # Render dashboard — sync: false means this file no longer stores it).
      - key: AI_ENGINE_KEY
        sync: false

      # Mail — set MAIL_PASSWORD in Render dashboard (not here)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_USERNAME
        value: REPLACE_WITH_GMAIL
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: noreply@msasagro.com
      - key: MAIL_FROM_NAME
        value: "MSAS FarmAI"

      # Paystack — set secrets in Render dashboard
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PAYMENT_URL
        value: https://api.paystack.co

      - key: FILESYSTEM_DISK
        value: local

  # ── AI Inference Engine (Python / FastAPI) ────────────────────────────────
  - type: web
    name: msas-ai-engine
    env: python
    region: frankfurt
    plan: starter
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # Set ANTHROPIC_API_KEY in the Render dashboard (sync: false keeps it secret)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Must match AI_ENGINE_KEY in the msas-farmai service above.
      # SECURITY: rotate this — see AI_ENGINE_KEY comment above.
      - key: API_KEY
        sync: false

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: msas-db
    databaseName: msas_production
    user: msas_user
    plan: free                 # Free 90-day trial → upgrade to Starter ($7/mo) after
    region: frankfurt
